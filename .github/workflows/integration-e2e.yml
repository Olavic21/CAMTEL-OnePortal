name: Integration + E2E

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          USE_CELERY: 'True'
          CELERY_BROKER_URL: redis://localhost:6379/0
          EMAIL_PROVIDER: 'smtp'
          EMAIL_HOST: 'localhost'
          EMAIL_PORT: '1025'
        run: |
          cd backend && python manage.py test -v 2

      - name: Start Celery worker
        env:
          USE_CELERY: 'True'
          CELERY_BROKER_URL: redis://localhost:6379/0
          EMAIL_PROVIDER: 'smtp'
          EMAIL_HOST: 'localhost'
          EMAIL_PORT: '1025'
        run: |
          cd backend && nohup celery -A config worker -l info > celery.log 2>&1 &

      - name: Smoke test async email (enqueue + worker)
        env:
          USE_CELERY: 'True'
          CELERY_BROKER_URL: redis://localhost:6379/0
          EMAIL_PROVIDER: 'smtp'
          EMAIL_HOST: 'localhost'
          EMAIL_PORT: '1025'
        run: |
          cd backend && python manage.py send_test_email --to ci-test@example.com
          # Allow worker a short moment to process
          sleep 5
          tail -n 200 celery.log || true

      - name: Install jq for JSON checks
        run: |
          sudo apt-get update && sudo apt-get install -y jq

      - name: Verify MailHog received email
        run: |
          # wait a short time for MailHog to accept the message
          sleep 2
          total=$(curl -sS http://localhost:8025/api/v2/messages | jq '.total')
          echo "MailHog messages: $total"
          if [ "$total" -eq 0 ]; then
            echo "No messages found in MailHog" >&2
            curl -sS http://localhost:8025/api/v2/messages | jq .
            exit 1
          fi

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: backend-tests
    services:
      web:
        image: node:20
        ports:
          - 5173:5173
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps
        run: |
          cd frontend/camtel/frontend && npm ci
      - name: Build frontend
        run: |
          cd frontend/camtel/frontend && npm run build
      - name: Start frontend preview
        run: |
          cd frontend/camtel/frontend && npm run preview &
      - name: Install Playwright browsers
        run: |
          cd frontend/camtel/frontend && npx playwright install --with-deps
      - name: Run Playwright E2E
        run: |
          cd frontend/camtel/frontend && npx playwright test --config=playwright.config.ts
