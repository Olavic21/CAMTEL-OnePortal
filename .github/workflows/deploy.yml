name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: camtel_test
          POSTGRES_USER: camtel
          POSTGRES_PASSWORD: camtel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U camtel -d camtel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: camtel_test
      DB_USER: camtel
      DB_PASSWORD: camtel
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests (PostgreSQL)
        run: |
          cd backend
          python manage.py migrate --noinput
          python manage.py test apps.products apps.core apps.users apps.partners --verbosity 2

      - name: Build Docker images
        run: docker compose build

      - name: Deployment placeholder
        run: echo "Déployer vers production via SSH/kubectl avec docker-compose.staging.yml ou docker-compose.yml"
