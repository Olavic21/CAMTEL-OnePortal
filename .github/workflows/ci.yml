name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Security audit (pip-audit)
        run: |
          python -m pip install pip-audit
          python -m pip_audit
      - name: Run Django tests (SQLite)
        run: |
          cd backend
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
          python manage.py test apps --verbosity 2
      - name: Catalog data validation
        run: |
          cd backend
          python manage.py validate_camtel_data

  backend-tests-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: camtel_test
          POSTGRES_USER: camtel
          POSTGRES_PASSWORD: camtel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U camtel -d camtel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: camtel_test
      DB_USER: camtel
      DB_PASSWORD: camtel
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Security audit (pip-audit)
        run: |
          python -m pip install pip-audit
          python -m pip_audit
      - name: Run Django tests (PostgreSQL)
        run: |
          cd backend
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
          python manage.py test apps --verbosity 2
      - name: Catalog data validation
        run: |
          cd backend
          python manage.py validate_camtel_data

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/camtel/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/camtel/frontend/package-lock.json
      - name: Install and test
        run: |
          npm ci
          npm run build
          # run unit tests
          npm run test -- --run
      - name: Security audit (npm)
        run: |
          npm audit --audit-level=moderate
