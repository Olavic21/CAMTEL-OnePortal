# Gateway nginx (staging/prod) — proxy /api/ vers Django, / vers le SPA React.
# En-tetes de securite poses ici une seule fois (point d'entree public unique),
# pour eviter les doublons/conflits avec le nginx interne du conteneur
# frontend (voir frontend/camtel/frontend/nginx.conf, qui reste minimal :
# cache des assets uniquement).
#
# CSP calibree sur l'appli reelle (voir index.html) : pas de script inline,
# police Google Fonts chargee via <link>, pas d'iframe. A adapter si un futur
# besoin (widget tiers, CDN d'images externe, etc.) l'exige.

server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
