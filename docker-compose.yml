services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: camtel
      POSTGRES_USER: camtel
      POSTGRES_PASSWORD: camtel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camtel -d camtel"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "${SECRET_KEY:-dev-only-insecure-key}"
      DEBUG: "${DEBUG:-True}"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DB_NAME: "${DB_NAME:-camtel}"
      DB_USER: "${DB_USER:-camtel}"
      DB_PASSWORD: "${DB_PASSWORD:-camtel}"
      DB_HOST: db
      DB_PORT: "5432"
      LOG_FORMAT: json
      # Seed demo : uniquement si explicitement active (jamais en prod).
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-True}"
    volumes:
      - ./backend:/app/backend
      - media_data:/app/backend/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
      python manage.py migrate &&
      if printf '%s' \"$$SEED_DEMO_DATA\" | grep -Eiq '^(1|true|yes|on)\$'; then python manage.py seed_data; fi &&
      python manage.py reset_pg_sequences &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "

  frontend:
    build:
      context: ./frontend/camtel/frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  media_data:
